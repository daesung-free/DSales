services:
  postgres:
    image: postgres:16
    container_name: sales-postgres
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales   # 로컬 개발 전용(운영 비밀 아님)
    ports:
      - "5432:5432"
    volumes:
      - sales-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: sales-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]  # refresh 토큰 영속(재시작 보존)
    volumes:
      - sales-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # DSRE2 로컬 복제본. 운영 DSRE2는 재구축 대상 아님 — 개발/검증용 복제(스키마·함수는 reference/legacy로 로드).
  # ★MariaDB 10.2 + lower_case_table_names=1 필수: 운영 DSRE2가 MariaDB 10.2.22이고, 저장함수가
  #   대문자 테이블명(TBL_REQUEST_CNT 등)을 참조 → 리눅스 기본(대소문자 구분)이면 함수 실행 실패.
  #   (mysql:8로 띄우면 인원산출/물류비 저장함수가 'table doesn't exist'로 깨짐 — 실검증으로 확인)
  dsre-mysql:
    image: mariadb:10.2
    container_name: sales-dsre-mariadb
    command: ["--lower-case-table-names=1"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dsre2
      MYSQL_USER: dsre
      MYSQL_PASSWORD: dsre
    ports:
      - "3307:3306"      # 로컬 5432/3306 충돌 회피
    volumes:
      - sales-dsredata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build: .
    container_name: sales-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 컨테이너 내부에선 DB/Redis 호스트가 서비스명. application.yml의 localhost를 덮어씀.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sales
      SPRING_DATASOURCE_USERNAME: sales
      SPRING_DATASOURCE_PASSWORD: sales
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"

volumes:
  sales-pgdata:
  sales-redisdata:
  sales-dsredata:
