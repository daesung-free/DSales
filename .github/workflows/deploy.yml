name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: dsales

jobs:
  # 1) 테스트 (Testcontainers — GitHub 러너에 Docker 있음)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 테스트
        run: chmod +x gradlew && ./gradlew test

  # 2) 이미지 빌드 → ECR push → EC2 배포
  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: ECR 임시 로그인 토큰 발급(EC2 전달용)
        id: token
        run: echo "pw=$(aws ecr get-login-password --region $AWS_REGION)" >> "$GITHUB_OUTPUT"

      - name: EC2 배포 (SSH) — DB 자격증명은 Secrets Manager에서 앱이 직접 조회
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,ECR_PW,DB_HOST,DB_SECRET_ID,REDIS_HOST,JWT_SECRET,AWS_REGION
          # ★DB 계정/비번을 -e 로 넣지 않는다. 넣으면 환경변수가 application-aws.yml 보다 우선순위가 높아
          #   Secrets Manager 조회를 무력화한다(=로테이션 장애 재발). DB_HOST/DB_SECRET_ID 만 전달.
          script: |
            set -e
            # 필수 시크릿 선검사 — 비어 있으면 컨테이너를 띄우지 않고 즉시 실패한다.
            # 빈 값으로 띄우면 접속 URL이 'secretsManagerSecretId=' 로 만들어져 앱이 기동 중 죽고,
            # 그때는 health 폴링 5분을 다 태운 뒤에야 원인을 알 수 있다(2026-08-04 배포 실패).
            missing=""
            [ -n "$DB_HOST" ]      || missing="$missing DB_HOST"
            [ -n "$DB_SECRET_ID" ] || missing="$missing DB_SECRET_ID"
            [ -n "$REDIS_HOST" ]   || missing="$missing REDIS_HOST"
            [ -n "$JWT_SECRET" ]   || missing="$missing JWT_SECRET"
            if [ -n "$missing" ]; then
              echo "!! GitHub Secret 미설정:$missing"
              echo "   저장소 Settings → Secrets and variables → Actions 에서 등록할 것."
              echo "   DB_SECRET_ID = RDS 관리형 시크릿 이름 또는 ARN (예: rds!db-xxxxxxxx)"
              exit 1
            fi
            echo "$ECR_PW" | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$REGISTRY/dsales:latest"
            docker stop dsales || true
            docker rm dsales || true
            docker run -d --name dsales --restart unless-stopped -p 8080:8080 \
              --log-driver=awslogs \
              --log-opt awslogs-region="$AWS_REGION" \
              --log-opt awslogs-group=/dsales/app \
              --log-opt awslogs-create-group=true \
              -e SPRING_PROFILES_ACTIVE=aws \
              -e AWS_REGION="$AWS_REGION" \
              -e DB_HOST="$DB_HOST" \
              -e DB_SECRET_ID="$DB_SECRET_ID" \
              -e SPRING_DATA_REDIS_HOST="$REDIS_HOST" \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e DAESUNG_SECURITY_JWTSECRET="$JWT_SECRET" \
              "$REGISTRY/dsales:latest"
            docker image prune -f
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PW: ${{ steps.token.outputs.pw }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_SECRET_ID: ${{ secrets.DB_SECRET_ID }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AWS_REGION: ${{ env.AWS_REGION }}

      # 배포가 "컨테이너는 떴는데 DB 못 붙음" 상태로 조용히 성공 처리되는 것을 막는다.
      # (2026-08-01 장애가 며칠간 안 잡힌 이유 = 기동 검증이 없었음)
      - name: 기동 검증 (health)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in $(seq 1 30); do
              body=$(curl -s -m 10 http://localhost:8080/actuator/health || true)
              case "$body" in
                *'"status":"UP"'*) echo "health OK: $body"; exit 0 ;;
              esac
              echo "waiting for health... ($i/30) $body"
              sleep 10
            done
            echo "!! 기동 검증 실패 — 컨테이너 로그:"
            docker logs --tail 100 dsales
            exit 1
