name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: dsales

jobs:
  # 1) 테스트 (Testcontainers — GitHub 러너에 Docker 있음)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 테스트
        run: chmod +x gradlew && ./gradlew test

  # 2) 이미지 빌드 → ECR push → EC2 배포
  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: ECR 임시 로그인 토큰 발급(EC2 전달용)
        id: token
        run: echo "pw=$(aws ecr get-login-password --region $AWS_REGION)" >> "$GITHUB_OUTPUT"

      - name: EC2 배포 (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,ECR_PW
          script: |
            echo "$ECR_PW" | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$REGISTRY/dsales:latest"
            docker stop dsales || true
            docker rm dsales || true
            docker run -d --name dsales --restart unless-stopped \
              -p 8080:8080 --env-file /home/ec2-user/app.env \
              "$REGISTRY/dsales:latest"
            docker image prune -f
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PW: ${{ steps.token.outputs.pw }}
