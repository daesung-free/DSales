name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: dsales

jobs:
  # 1) 테스트 (Testcontainers — GitHub 러너에 Docker 있음)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 테스트
        run: chmod +x gradlew && ./gradlew test

  # 2) 이미지 빌드 → ECR push → EC2 배포
  build-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 자격증명
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 & push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: ECR 임시 로그인 토큰 발급(EC2 전달용)
        id: token
        run: echo "pw=$(aws ecr get-login-password --region $AWS_REGION)" >> "$GITHUB_OUTPUT"

      - name: EC2 배포 (SSH) — 설정도 Secrets에서 자동 주입(수동 app.env 불필요)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: REGISTRY,ECR_PW,DB_URL,DB_USER,DB_PASSWORD,REDIS_HOST,JWT_SECRET
          script: |
            echo "$ECR_PW" | docker login --username AWS --password-stdin "$REGISTRY"
            docker pull "$REGISTRY/dsales:latest"
            docker stop dsales || true
            docker rm dsales || true
            docker run -d --name dsales --restart unless-stopped -p 8080:8080 \
              --log-driver=awslogs \
              --log-opt awslogs-region=ap-northeast-2 \
              --log-opt awslogs-group=/dsales/app \
              --log-opt awslogs-create-group=true \
              -e SPRING_DATASOURCE_URL="$DB_URL" \
              -e SPRING_DATASOURCE_USERNAME="$DB_USER" \
              -e SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
              -e SPRING_DATA_REDIS_HOST="$REDIS_HOST" \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e DAESUNG_SECURITY_JWTSECRET="$JWT_SECRET" \
              "$REGISTRY/dsales:latest"
            docker image prune -f
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_PW: ${{ steps.token.outputs.pw }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
