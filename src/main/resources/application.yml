spring:
  application:
    name: sales
  datasource:
    url: jdbc:mysql://localhost:3306/sales?characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul
    username: sales
    password: sales          # 로컬 개발 전용(docker-compose). 운영은 시크릿 매니저로.
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 만들고, 엔티티↔스키마 일치만 검증
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true             # 기동 시 db/migration/V*.sql 자동 적용
  data:
    redis:                    # refresh 토큰 저장(TTL 자동만료). 컨테이너에선 host=redis로 override.
      host: localhost
      port: 6379

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug

# 계산서(홈택스) 공급자(자사) 정보. ★실값은 배포 시 환경변수/시크릿으로 주입 — 소스에 커밋 금지.
# 예: DAESUNG_SUPPLIER_BIZ-NO=... (2법인 지원은 후속: default/consign 분리)
daesung:
  supplier:
    biz-no: ""
    name: ""
    boss-name: ""
    addr: ""
    biz-status: ""
    biz-item: ""
  # 인증/JWT. ★jwt-secret은 배포 시 환경변수(DAESUNG_SECURITY_JWT-SECRET)로 override — 아래는 로컬 개발 전용 더미.
  security:
    jwt-secret: "local-dev-only-change-me-please-32bytes-minimum-secret-key"
    access-token-minutes: 30
    refresh-token-days: 14
    # refresh 쿠키 Secure 플래그. 현재 라이브/로컬은 http라 false. ★https(ALB) 도입 시 true로.
    cookie-secure: false
  # DSRE2(기존 라이브 유지) 연결. 기본 off — 켜면 별도 DataSource로 함수 호출/조회.
  # ★운영 접속정보는 배포 시 시크릿으로 주입. 로컬은 docker dsre-mysql(3307) 복제본.
  dsre:
    enabled: false
    url: "jdbc:mysql://localhost:3307/dsre2?characterEncoding=UTF-8&useUnicode=true"
    username: "dsre"
    password: "dsre"
    read-only: false     # 매출일괄등록 write-back(state='T')이 있어 쓰기 필요. 그 외는 SELECT/함수호출만.
