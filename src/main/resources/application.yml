spring:
  application:
    name: sales
  datasource:
    url: jdbc:mysql://localhost:3306/sales?characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul
    username: sales
    password: sales          # 로컬 개발 전용(docker-compose). 운영은 시크릿 매니저로.
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 만들고, 엔티티↔스키마 일치만 검증
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true             # 기동 시 db/migration/V*.sql 자동 적용
  mail:
    # ★메일 발송 설정(9/27 항목 17·A-4). 레거시 Common.vb:SendMail 의 값을 그대로 쓰되
    #   **소스에는 두지 않는다** — 레거시는 SMTP 계정과 비밀번호가 .vb 에 하드코딩돼 있었고,
    #   그건 소스를 받은 사람 누구나 회사 메일로 발송할 수 있다는 뜻이다(§9 위반).
    #   호스트·포트·계정까지 전부 환경변수로 받는다. 값이 비면 발송 기능이 꺼진다(아래 daesung.mail.enabled).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # ★465 포트지만 **STARTTLS** 다(2026-09-28 서버 실측).
          #   레거시 .NET SmtpClient 는 EnableSsl=true 여도 암시적 SSL 을 못 해 STARTTLS 로 붙는데,
          #   서버가 거기 맞춰져 있다. 암시적 SSL 로 붙으면 'wrong version number' 로 끊긴다.
          #   → 운영값은 MAIL_SSL=false · MAIL_STARTTLS=true 다.
          ssl:
            enable: ${MAIL_SSL:true}
            # ★인증서 체인이 불완전한 서버를 위한 우회. 호스트명을 넣으면 **그 호스트만** 통과시킨다.
            #
            #   mail.dshw.co.kr 은 자기 인증서 하나만 보내고 중간 CA 를 안 보낸다(2026-09-28 실측).
            #   Windows(.NET)는 중간 인증서를 알아서 받아와 레거시는 문제가 없었지만,
            #   Java 는 그 보완을 하지 않아 PKIX path building failed 로 막힌다.
            #
            #   ‼️정답은 **메일 서버가 중간 인증서를 함께 보내도록 고치는 것**이고, 그러면 이 값을 비운다.
            #     넣으면 그 호스트에 한해 인증서 검증을 건너뛴다 — 기본은 비움이다.
            trust: ${MAIL_SSL_TRUST:}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
  data:
    redis:                    # refresh 토큰 저장(TTL 자동만료). 컨테이너에선 host=redis로 override.
      host: localhost
      port: 6379

server:
  port: 8080

management:
  health:
    # ★★메일 서버 상태를 앱 상태에 섞지 않는다.
    #
    #   spring-boot-starter-mail 을 넣는 순간 액추에이터가 MailHealthIndicator 를 자동으로 달고,
    #   기동할 때마다 SMTP 에 접속을 시도한다. 그게 실패하면 /actuator/health 가 통째로 DOWN 이 되고,
    #   배포 스크립트의 기동 검증이 그 값을 보기 때문에 **배포 자체가 막힌다**.
    #   (2026-09-28 실제로 이렇게 배포가 실패했다 — SMTPTransport SSLException 으로 30회 DOWN.)
    #
    #   메일은 부가 기능이다. 메일 서버가 안 된다고 매출·재고가 안 도는 것이 아니다.
    #   발송 실패는 발송하는 그 순간에 알리면 된다 — 우리는 설정이 없으면 400,
    #   개별 실패는 거래처별 결과(FAILED)로 돌려주고 있다. 헬스체크가 대신 소리칠 자리가 아니다.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: debug

# 계산서(홈택스) 공급자(자사) 정보. ★실값은 배포 시 환경변수/시크릿으로 주입 — 소스에 커밋 금지.
# 예: DAESUNG_SUPPLIER_BIZ-NO=... (2법인 지원은 후속: default/consign 분리)
daesung:
  mail:
    # ‼️기본 off. 설정이 비어 있는 채로 켜 두면 화면에서 '전송'을 눌렀을 때
    #   조용히 실패하고 담당자는 보냈다고 믿는다. 값을 넣은 환경에서만 켠다.
    enabled: ${MAIL_ENABLED:false}
    # 보내는 사람. 레거시는 발신 계정과 같은 주소를 썼고 참조(CC)에도 자기를 넣었다.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:대성학력개발연구소}
    # 본문 문구(레거시 조회.vb:3781 그대로). 회사명이 바뀌면 여기만 고친다.
    body: ${MAIL_BODY:(주)대성학력개발연구소에서 발송된 메일입니다.}
    # 참조로 발신자를 넣을지. 레거시는 항상 넣었다(보낸 기록을 메일함에 남기려는 것).
    cc-sender: ${MAIL_CC_SENDER:true}
  supplier:
    # 계산서(홈택스)·거래명세서의 공급자 블록. 발행 법인은 대성학력개발연구소 1개 확정(정본 2탭).
    #
    # ★값의 출처: 드라이브 `세금계산신고_엑셀다운로드양식.xlsx`(재무팀 실파일, 2026-07-24) 7행.
    #   이전에 "정본에 없어 비워 둔다"고 적었던 것은 양식 파일을 안 열어본 오판이었다.
    #
    # ★커밋 판단 — 예전 주석은 "실값은 환경변수로만, 소스 커밋 금지"였다. 바꾼 이유:
    #   ① 이 값들은 **계산서·거래명세서에 인쇄되어 거래처마다 배포되는 공개 정보**다.
    #      DB 계정·API 키처럼 알면 접근 권한이 생기는 종류가 아니다(§9가 막는 대상은 그쪽이다).
    #   ② 비워 두면 홈택스 제출 자체가 안 되는데, 그 사실은 재무팀이 신고하려는 순간에야 드러난다.
    #   ③ 환경변수 override는 그대로 살아 있다(DAESUNG_SUPPLIER_BIZ-NO 등).
    #   법인이 바뀌거나 값이 갱신되면 여기를 고치거나 환경변수로 덮으면 된다.
    biz-no: "1088166057"
    name: "주식회사 대성학력개발연구소"
    boss-name: "김석규"
    addr: "서울특별시 동작구 노량진로 120"
    biz-status: "제조"        # 업태
    biz-item: "출판업"        # 종목
    # ‼️전화번호만 아직 비어 있다. 나머지 6개와 달리 **어느 자료에도 확정값이 없다** —
    #   세금계산신고 양식엔 전화 칸 자체가 없고(끝의 '02'는 영수01/청구02 코드다),
    #   레거시 하드코딩(세금계산신고.vb:415)도 전화 자리가 비어 있다.
    #   거래명세서 실물 샘플에는 인쇄돼 있으나 도장에 가려 두 자리가 안 읽힌다: (02) 8?0 2?01
    #   → 거래처에 인쇄되어 나가는 값이라 추측으로 채우지 않는다. 확인 후 넣을 것.
    #     비어 있으면 거래명세서 공급자 블록의 전화번호 칸이 빈 채로 출력된다.
    tel: ""            # 거래명세서 공급자 블록 전화번호(실물 양식 항목) — 확인 대기
  # CORS 허용 오리진. 프론트가 별도 도메인이라 명시 필요(자격증명 전송이라 "*" 불가).
  cors:
    # sales.d-dlab.link = 프론트 서비스 도메인. https/http 둘 다 둔다 —
    # 아직 API·프론트에 TLS가 안 붙은 구간이 있어 http로 뜨는 동안에도 붙어야 한다.
    allowed-origins: "http://localhost:3000,http://localhost:5173,https://sales.d-dlab.link,http://sales.d-dlab.link"
    # Amplify는 브랜치마다 서브도메인이 생긴다 → 앱 ID를 고정한 패턴으로 한 번에 허용.
    # (develop.d1z41nzmh4zrdi.amplifyapp.com 등)
    allowed-origin-patterns: "https://*.d1z41nzmh4zrdi.amplifyapp.com"
  # 재고 정책.
  inventory:
    # 재고가 음수가 되는 차감(폐기·출고·이고·조립)을 허용할지.
    #   false = 차단 — 개발팀 점검(2026-09-11) 지적 반영. 현재고보다 많은 폐기가 그대로 통과했다.
    #   true  = 허용 — 발주처 화면검토(2026-08-31) "재고 음수 차단 로직은 적용되면 안됩니다".
    # ★지시가 갈려 있어 설정으로 뺐다. 확정되면 여기만 바꾸면 된다(재배포 불요, 환경변수 override 가능).
    # ★음수 재고는 막지 않는다 — 발주처 확정(2026-08-31 화면7):
    #   "입고 전 출고되는 상품은 재고 (−)로 처리되며 … 마이너스로 표시되는 게 정상"
    #   막지 않는 대신 응답 warnings[] 로 알린다. 예외적으로 막아야 하면 true.
    block-negative-stock: false
  # 인증/JWT. ★jwt-secret은 배포 시 환경변수(DAESUNG_SECURITY_JWT-SECRET)로 override — 아래는 로컬 개발 전용 더미.
  security:
    jwt-secret: "local-dev-only-change-me-please-32bytes-minimum-secret-key"
    access-token-minutes: 30
    refresh-token-days: 14
    # refresh 쿠키 Secure 플래그. 현재 라이브/로컬은 http라 false. ★https 도입 시 true로.
    cookie-secure: false
    # refresh 쿠키 SameSite. 로컬(프론트·API 같은 호스트)은 Strict로 충분하다.
    # ★프론트와 API 도메인이 다르면(Amplify ↔ API 서버) 반드시 None —
    #   Strict/Lax면 브라우저가 쿠키를 아예 안 보내 30분 뒤 재발급이 실패한다.
    #   ‼️None은 Secure 필수라 https가 먼저다(둘이 어긋나면 기동 시 막는다).
    cookie-same-site: Strict
  # DSRE2(기존 라이브 유지) 연결. 기본 off — 켜면 별도 DataSource로 함수 호출/조회.
  # ★운영 접속정보는 배포 시 시크릿으로 주입. 로컬은 docker dsre-mysql(3307) 복제본.
  dsre:
    enabled: false
    url: "jdbc:mysql://localhost:3307/dsre2?characterEncoding=UTF-8&useUnicode=true"
    username: "dsre"
    password: "dsre"
    read-only: false     # 매출일괄등록 write-back(state='T')이 있어 쓰기 필요. 그 외는 SELECT/함수호출만.
