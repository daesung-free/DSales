plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.daesung'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// QueryDSL Q-클래스 생성 위치
def generatedDir = "$buildDir/generated/sources/annotationProcessor/java/main"

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '5.1.0'
	poiVersion = '5.3.0'
	springdocVersion = '2.7.0'
	// Docker Engine 29.x(min API 1.40) 대응 — Boot 3.4.5 기본 TC(1.20.6)의 docker-java가 구 API로 핑해 실패.
	set('testcontainers.version', '1.21.3')
}

dependencies {
	// --- Web / API ---
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Persistence (JPA + QueryDSL + MySQL 8) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// --- Schema migration (신규 스키마 대량 → 초반부터 이력관리) ---
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// --- Security / RBAC ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// --- Redis (refresh 토큰 저장·TTL 자동만료. 캐시 확장 여지) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// --- Excel (홈택스 양식·명세서·RAW export) ---
	implementation "org.apache.poi:poi-ooxml:${poiVersion}"

	// --- API 문서 (OpenAPI 계약, Phase1) ---
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- 편의 ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// --- DSRE2(MariaDB) 접속: 위 mysql-connector-j 공용 사용(주 DB도 MySQL8) ---
	// runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'  // DSLab / DSTxtBook (SQL Server) — 필요 시

	// --- Test (트랜잭션 원자성·동시성은 실제 DB로 검증) ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL 생성 소스 디렉토리 등록
sourceSets {
	main {
		java {
			srcDir generatedDir
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 로컬 Docker Desktop(macOS) 소켓을 Testcontainers에 전달. CI/타 환경은 환경변수 우선.
	def dockerHost = System.getenv('DOCKER_HOST')
	if (dockerHost) {
		environment 'DOCKER_HOST', dockerHost
	} else if (file("${System.getProperty('user.home')}/.docker/run/docker.sock").exists()) {
		environment 'DOCKER_HOST', "unix://${System.getProperty('user.home')}/.docker/run/docker.sock"
	}
	environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
	// Docker Engine 29.x는 min API 1.40 — docker-java 기본값(1.32)이 낮아 400. env·시스템프로퍼티 양쪽 주입.
	def apiVer = System.getenv('DOCKER_API_VERSION') ?: '1.44'
	environment 'DOCKER_API_VERSION', apiVer
	systemProperty 'api.version', apiVer          // docker-java Properties 키
}

clean {
	delete file(generatedDir)
}
