plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	// 정적분석(P0-07 / 검수 S-7 "정적분석 SQLi 0건"). SpotBugs + FindSecBugs 보안 룰.
	id 'com.github.spotbugs' version '6.0.26'
	// 테스트 커버리지 측정. 검증 '건수'만으로는 "코드의 얼마를 덮었나"에 답할 수 없다.
	id 'jacoco'
}

group = 'com.daesung'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// QueryDSL Q-클래스 생성 위치
def generatedDir = "$buildDir/generated/sources/annotationProcessor/java/main"

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '5.1.0'
	poiVersion = '5.3.0'
	springdocVersion = '2.7.0'
	awsJdbcWrapperVersion = '2.6.0'
	findSecBugsVersion = '1.13.0'
	awsSdkVersion = '2.46.7'
	// Docker Engine 29.x(min API 1.40) 대응 — Boot 3.4.5 기본 TC(1.20.6)의 docker-java가 구 API로 핑해 실패.
	set('testcontainers.version', '1.21.3')
}

dependencies {
	// --- Web / API ---
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Persistence (JPA + QueryDSL + MySQL 8) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// --- DB 자격증명을 Secrets Manager에서 (aws 프로파일 전용) ---
	// AWS Advanced JDBC Wrapper의 awsSecretsManager 플러그인: 커넥션 생성 시마다 시크릿의 계정/비번을 사용하고,
	// 인증 실패 시 캐시를 버리고 시크릿을 재조회해 1회 재시도 → RDS 관리형 자격증명 자동 로테이션 중에도 앱이 안 죽는다.
	// (로컬/테스트는 default 프로파일 = 순정 mysql-connector-j 경로 그대로. application-aws.yml에서만 드라이버 교체)
	runtimeOnly "software.amazon.jdbc:aws-advanced-jdbc-wrapper:${awsJdbcWrapperVersion}"
	runtimeOnly platform("software.amazon.awssdk:bom:${awsSdkVersion}")
	runtimeOnly 'software.amazon.awssdk:secretsmanager'
	implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// --- Schema migration (신규 스키마 대량 → 초반부터 이력관리) ---
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// --- Security / RBAC ---
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// --- Redis (refresh 토큰 저장·TTL 자동만료. 캐시 확장 여지) ---
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// --- Excel (홈택스 양식·명세서·RAW export) ---
	implementation "org.apache.poi:poi-ooxml:${poiVersion}"

	// --- API 문서 (OpenAPI 계약, Phase1) ---
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- 편의 ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// --- DSRE2(MariaDB) 접속: 위 mysql-connector-j 공용 사용(주 DB도 MySQL8) ---
	// runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'  // DSLab / DSTxtBook (SQL Server) — 필요 시

	// --- Test (트랜잭션 원자성·동시성은 실제 DB로 검증) ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL 생성 소스 디렉토리 등록
sourceSets {
	main {
		java {
			srcDir generatedDir
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 로컬 Docker Desktop(macOS) 소켓을 Testcontainers에 전달. CI/타 환경은 환경변수 우선.
	def dockerHost = System.getenv('DOCKER_HOST')
	if (dockerHost) {
		environment 'DOCKER_HOST', dockerHost
	} else if (file("${System.getProperty('user.home')}/.docker/run/docker.sock").exists()) {
		environment 'DOCKER_HOST', "unix://${System.getProperty('user.home')}/.docker/run/docker.sock"
	}
	environment 'TESTCONTAINERS_RYUK_DISABLED', 'true'
	// Docker Engine 29.x는 min API 1.40 — docker-java 기본값(1.32)이 낮아 400. env·시스템프로퍼티 양쪽 주입.
	def apiVer = System.getenv('DOCKER_API_VERSION') ?: '1.44'
	environment 'DOCKER_API_VERSION', apiVer
	systemProperty 'api.version', apiVer          // docker-java Properties 키
}

// ── 테스트 커버리지 ────────────────────────────────────────────────────────
// 측정 대상에서 빼는 것들: 실행 코드가 아니거나(설정·DTO·엔티티 접근자),
// 테스트 환경에서 아예 꺼져 있어(DSRE 연동) 0으로 잡히면 수치를 왜곡하는 구간.
// ‼️제외는 "안 덮은 것을 숨기는 용도"가 아니라 "분모를 정직하게 만드는 용도"다 —
//   서비스·컨트롤러·리포지토리 같은 실제 로직은 하나도 빼지 않는다.
jacoco {
	toolVersion = '0.8.12'
}

def coverageExcludes = [
		'com/daesung/sales/**/dto/**',        // 값 객체(record) — 접근자뿐
		'com/daesung/sales/config/**',        // 스프링 설정
		'com/daesung/sales/**/entity/**Q*',   // QueryDSL 생성 클래스
		'com/daesung/sales/SalesApplication*'
]

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExcludes)
	}))
}

clean {
	delete file(generatedDir)
}

// ── 정적분석 (P0-07 / 검수 S-7) ────────────────────────────────────────────
// 근거: 검수 통과 기준 "정적분석 SQLi 0건" — 검사할 도구 자체가 없었다.
// SpotBugs 본체 + FindSecBugs 플러그인(SQL 인젝션·하드코딩 비밀·경로조작 등 보안 룰).
dependencies {
	spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findSecBugsVersion}"
}

spotbugs {
	toolVersion = '4.8.6'
	effort = com.github.spotbugs.snom.Effort.valueOf('MAX')  // 보안 룰은 최대 분석에서 잘 잡힌다
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW') // 낮은 확신도까지 = 놓치는 것보다 낫다
	excludeFilter = file('config/spotbugs-exclude.xml')
	// 테스트 코드는 대상에서 제외(운영 코드만 본다)
	ignoreFailures = false
}

// 테스트 소스는 검사하지 않는다 — 픽스처의 문자열 조립까지 잡으면 노이즈만 커진다.
tasks.named('spotbugsTest') { enabled = false }

tasks.named('spotbugsMain') {
	reports {
		html { required = true; outputLocation = file("$buildDir/reports/spotbugs/main.html") }
		xml { required = true }
	}
}
